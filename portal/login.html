<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>Driver Portal Login | Virtual Car Hire</title>

  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#e85d04"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="/assets/style.css"/>

  <style>
    * { box-sizing: border-box; }
    body {
      background: #0f0f14;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      margin: 0;
    }

    .portal-header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #14141d;
    }
    .portal-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #fff;
    }
    .portal-brand img { height: 36px; }
    .portal-brand strong { font-size: 16px; display: block; }
    .portal-brand small { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: #181824;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-header h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: #fff;
    }
    .auth-header p {
      color: #999;
      font-size: 14px;
      margin: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ccc;
      margin-bottom: 8px;
    }
    .input-wrapper {
      position: relative;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 15px;
    }
    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: #0f0f14;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .input-wrapper input:focus {
      outline: none;
      border-color: #e85d04;
      box-shadow: 0 0 0 3px rgba(232, 93, 4, 0.2);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }
    .forgot-link {
      color: #e85d04;
      font-size: 13px;
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot-link:hover { text-decoration: underline; }

    .auth-btn {
      width: 100%;
      background: #e85d04;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .auth-btn:hover {
      background: #c94e00;
    }
    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }
    .alert-error {
      background: rgba(220, 53, 69, 0.2);
      border: 1px solid #dc3545;
      color: #ff6b6b;
    }
    .alert-success {
      background: rgba(40, 167, 69, 0.2);
      border: 1px solid #28a745;
      color: #51cf66;
    }

    .portal-footer {
      text-align: center;
      padding: 24px;
      color: #666;
      font-size: 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /*
      SECURITY ARCHITECTURE NOTE:
      There is deliberately NO "Create Account" or "Sign Up" link on this login page.
      Virtual Car Hire Driver Portal registration is strictly invite-only.
      New driver accounts can only be initiated by authorized company staff via the internal CRM,
      which generates a unique invite link sent directly to the driver.
    */
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/portal.js"></script>
</head>
<body>

  <header class="portal-header">
    <a href="/" class="portal-brand">
      <img src="/assets/logo.png" alt="Virtual Car Hire Logo"/>
      <div>
        <strong>Virtual Car Hire</strong>
        <small>Driver Portal</small>
      </div>
    </a>
    <a href="/" style="color:#aaa; text-decoration:none; font-size:14px;"><i class="fa-solid fa-house"></i> Main Site</a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Driver Login</h1>
        <p>Access your rental details, mileage &amp; documents</p>
      </div>

      <div id="alertBox" class="alert alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" required placeholder="name@example.com" autocomplete="email"/>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password"/>
          </div>
        </div>

        <div class="form-actions">
          <a href="#" id="forgotPasswordLink" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn" class="auth-btn">
          <span>Log In</span> <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>
    </div>
  </main>

  <footer class="portal-footer">
    &copy; 2026 Virtual Car Hire Ltd. All rights reserved.
  </footer>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const supabase = window.initVchSupabase();
      const loginForm = document.getElementById('loginForm');
      const loginBtn = document.getElementById('loginBtn');
      const alertBox = document.getElementById('alertBox');
      const forgotPasswordLink = document.getElementById('forgotPasswordLink');

      function showAlert(msg, isSuccess = false) {
        alertBox.textContent = msg;
        alertBox.className = `alert ${isSuccess ? 'alert-success' : 'alert-error'}`;
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Check if user is already logged in
      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          window.location.href = '/portal/dashboard';
          return;
        }
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
          showAlert('Please enter both email and password.');
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

        try {
          if (!supabase) {
            throw new Error('Supabase client connection not configured.');
          }

          // Step 1: Standard Password Sign-in (Designed with modular boundary so a 2-step MFA/OTP step can slot in here later)
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            showAlert(error.message);
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<span>Log In</span> <i class="fa-solid fa-right-to-bracket"></i>';
            return;
          }

          // Successful login -> Redirect to driver dashboard
          window.location.href = '/portal/dashboard';
        } catch (err) {
          showAlert(err.message || 'An error occurred during login. Please try again.');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Log In</span> <i class="fa-solid fa-right-to-bracket"></i>';
        }
      });

      forgotPasswordLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
          showAlert('Please enter your email address above to reset your password.');
          return;
        }

        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/portal/login'
          });
          if (error) {
            showAlert(error.message);
          } else {
            showAlert('Password reset instructions sent to your email.', true);
          }
        } catch (err) {
          showAlert('Unable to send password reset email.');
        }
      });
    });
  </script>
</body>
</html>
